name: Signet source checks (native builds paused)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Source-only launch policy checks
        run: python scripts/check-source-safety.py --self-test
  windows-x86:
    # SECURITY_HOLD: source review does not clear a blocked native artifact.
    # Re-enable only after a separately reviewed security/build decision.
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target i686-pc-windows-msvc
          rustup default 1.96.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Default build
        run: cargo build --workspace --locked --target i686-pc-windows-msvc
      - name: Runtime and compatibility tests
        run: cargo test --workspace --locked --target i686-pc-windows-msvc --features windower-runtime/game-thread-probe,windower-runtime/client-windowing,windower-runtime/isolated-probe
      - name: LuaJIT provider tests
        run: cargo test --locked --manifest-path providers/luajit/Cargo.toml --target i686-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target i686-pc-windows-msvc --features windower-runtime/game-thread-probe,windower-runtime/client-windowing,windower-runtime/isolated-probe -- -D warnings
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.5.0'
      - name: Player interface format and build
        working-directory: ui/player-preview
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
