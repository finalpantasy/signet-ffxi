name: Rust source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target i686-pc-windows-msvc
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Default build
        run: cargo build --workspace --locked --target i686-pc-windows-msvc
      - name: Runtime and compatibility tests
        run: cargo test --workspace --locked --target i686-pc-windows-msvc --features windower-runtime/game-thread-probe,windower-runtime/client-windowing,windower-runtime/isolated-probe
      - name: LuaJIT provider tests
        run: cargo test --locked --manifest-path providers/luajit/Cargo.toml --target i686-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target i686-pc-windows-msvc --features windower-runtime/game-thread-probe,windower-runtime/client-windowing,windower-runtime/isolated-probe -- -D warnings
      - name: Player interface format and build
        working-directory: ui/player-preview
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
