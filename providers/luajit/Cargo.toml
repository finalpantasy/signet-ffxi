[package]
name = "windower-luajit-provider"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Build separately: Cargo unifies mlua's mutually exclusive Lua-engine
# features within a build. This DLL shares no Lua objects with the core.
[workspace]
resolver = "3"

[lib]
name = "windower_luajit_provider"
crate-type = ["cdylib"]

[dependencies]
windower-rs = { path = "../.." }
mlua = { version = "=0.11.4", features = ["luajit", "vendored", "send"] }
serde_json = "=1.0.149"

[profile.dev]
incremental = false
[profile.test]
incremental = false
