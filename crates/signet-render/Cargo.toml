[package]
name = "signet-render"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Signet for FFXI: Direct3D 12 and Vulkan zone viewer"

[dependencies]
signet-dat = { path = "../signet-dat" }
signet-parity = { path = "../signet-parity" }
ash = "0.38"

[build-dependencies]
naga = { version = "25", default-features = false, features = ["wgsl-in", "spv-out"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
